# dotMARC on a DigitalOcean Droplet: the published image + PostgreSQL + Caddy (automatic HTTPS).
# deploy.py copies this file, Caddyfile and a generated .env onto the Droplet at /opt/dotmarc via
# cloud-init and starts it; nothing here needs hand-editing. Same shape as
# docker-compose.selfhosted.yml at the repo root, but runs the published image instead of
# building from source, which a small Droplet is too short of memory to do comfortably.

services:
  app:
    image: ghcr.io/homotechsual/dotmarc:${DOTMARC_VERSION:?Set DOTMARC_VERSION}
    restart: unless-stopped
    environment:
      ConnectionStrings__DotMarc: "Host=postgres;Database=dotmarc;Username=dotmarc;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      Graph__ClientId: ${GRAPH_CLIENT_ID:?Set GRAPH_CLIENT_ID}
      Graph__TenantId: ${GRAPH_TENANT_ID:?Set GRAPH_TENANT_ID}
      Graph__ClientSecret: ${GRAPH_CLIENT_SECRET:?Set GRAPH_CLIENT_SECRET}
      Graph__MailboxAddress: ${GRAPH_MAILBOX_ADDRESS:?Set GRAPH_MAILBOX_ADDRESS}
      Graph__TlsrptMailboxAddress: ${GRAPH_TLSRPT_MAILBOX_ADDRESS:-}
      EntraId__TenantId: ${ENTRAID_TENANT_ID:?Set ENTRAID_TENANT_ID}
      EntraId__ClientId: ${ENTRAID_CLIENT_ID:?Set ENTRAID_CLIENT_ID}
      EntraId__ClientSecret: ${ENTRAID_CLIENT_SECRET:?Set ENTRAID_CLIENT_SECRET}
      InitialAdmins__Emails: ${INITIAL_ADMIN_EMAILS:?Set INITIAL_ADMIN_EMAILS}
      MtaSts__HostingHostname: ${DOTMARC_HOSTNAME:?Set DOTMARC_HOSTNAME}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOTMARC_HOSTNAME: ${DOTMARC_HOSTNAME:?Set DOTMARC_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: dotmarc
      POSTGRES_USER: dotmarc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotmarc -d dotmarc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  caddy-data:
